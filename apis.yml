name: Atomo Coffee
description: 'Atomo Coffee is a Seattle-based food-tech company that makes beanless "molecular" coffee: it
  reverse-engineers the coffee bean and reconstructs the taste, aroma, and caffeine of coffee from upcycled,
  naturally derived plant ingredients, producing cold brew, ground, and canned products with a lower carbon
  and water footprint than conventional bean-grown coffee. Backed by bessemer-venture-partners and other
  investors, it sells direct-to-consumer through a Shopify storefront at atomocoffee.com. Atomo is a consumer
  packaged-goods brand and publishes no first-party developer API; this profile is maintained in the API
  Evangelist network as a company record. Sector: deep-tech / food-tech.'
